name: SIM HAF UAT (manual reporting run)

# Manual only. This workflow talks to the staging UAT environment using
# repository secrets and must NEVER run automatically (push/PR) or be
# triggered during development. It is the ONLY workflow that uses UAT secrets.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id used to name reports/artifacts (default: github.run_id)'
        required: false
        default: ''
      batch_ids:
        description: 'Comma-separated batch ids from reporting.config.json, or "all"'
        required: false
        default: 'all'
      workers:
        description: 'Workers per batch. Keep at 1 to respect the login throttle.'
        required: false
        default: '1'
      cooldown_seconds:
        description: 'Seconds to wait before EACH batch, including the first (login throttle is 5/min).'
        required: false
        default: '75'

permissions:
  contents: read

concurrency:
  # Never let two UAT runs hit staging at the same time.
  group: sim-haf-uat
  cancel-in-progress: false

jobs:
  uat:
    name: Batched UAT run + reporting
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Credentials come ONLY from GitHub Secrets; nothing is logged.
      #
      # Naming convention (mirrors test-data/users.ts / .env.example):
      #   <FIELD>_<IDENTITY> with a UAT_ prefix, plus BASE_URL.
      # An EMPTY secret leaves the value unset, so the corresponding guard in
      # `declareScenario` skips only those tests that need that identity.
      BASE_URL: ${{ secrets.BASE_URL }}

      # --- Superadmin (TC-REQ-001 .. TC-REQ-011) ---
      UAT_EMAIL_SUPERADMIN: ${{ secrets.UAT_EMAIL_SUPERADMIN }}
      UAT_PASSWORD_SUPERADMIN: ${{ secrets.UAT_PASSWORD_SUPERADMIN }}
      UAT_OTP_REQUIRED_SUPERADMIN: ${{ secrets.UAT_OTP_REQUIRED_SUPERADMIN }}
      UAT_TOTP_SECRET_SUPERADMIN: ${{ secrets.UAT_TOTP_SECRET_SUPERADMIN }}

      # --- Deliberately inactive account (TC-REQ-010) ---
      # Distinct from the "PJ Seksi (Nonaktif)" role identity below; never mix.
      UAT_EMAIL_INACTIVE: ${{ secrets.UAT_EMAIL_INACTIVE }}
      UAT_PASSWORD_INACTIVE: ${{ secrets.UAT_PASSWORD_INACTIVE }}

      # --- Invalid credential pair (TC-REQ-006) ---
      # Optional: a built-in deliberately-wrong default is used when unset.
      UAT_EMAIL_INVALID: ${{ secrets.UAT_EMAIL_INVALID }}
      UAT_PASSWORD_INVALID: ${{ secrets.UAT_PASSWORD_INVALID }}

      # --- Role identities (see test-data/users.ts `roleIdentity` exports) ---
      # Each `*_OTP_REQUIRED` / `*_TOTP_SECRET` pair is OPTIONAL. They must stay
      # unset (or `*_OTP_REQUIRED=false`) for accounts that do NOT use OTP; the
      # suite derives `otpRequired` from TOTP-secret presence. OTP is never
      # forced onto an account that does not need it.
      UAT_EMAIL_KETUA_UMUM: ${{ secrets.UAT_EMAIL_KETUA_UMUM }}
      UAT_PASSWORD_KETUA_UMUM: ${{ secrets.UAT_PASSWORD_KETUA_UMUM }}
      UAT_OTP_REQUIRED_KETUA_UMUM: ${{ secrets.UAT_OTP_REQUIRED_KETUA_UMUM }}
      UAT_TOTP_SECRET_KETUA_UMUM: ${{ secrets.UAT_TOTP_SECRET_KETUA_UMUM }}

      UAT_EMAIL_SEKRETARIS_UMUM: ${{ secrets.UAT_EMAIL_SEKRETARIS_UMUM }}
      UAT_PASSWORD_SEKRETARIS_UMUM: ${{ secrets.UAT_PASSWORD_SEKRETARIS_UMUM }}
      UAT_OTP_REQUIRED_SEKRETARIS_UMUM: ${{ secrets.UAT_OTP_REQUIRED_SEKRETARIS_UMUM }}
      UAT_TOTP_SECRET_SEKRETARIS_UMUM: ${{ secrets.UAT_TOTP_SECRET_SEKRETARIS_UMUM }}

      UAT_EMAIL_BENDAHARA_UMUM: ${{ secrets.UAT_EMAIL_BENDAHARA_UMUM }}
      UAT_PASSWORD_BENDAHARA_UMUM: ${{ secrets.UAT_PASSWORD_BENDAHARA_UMUM }}
      UAT_OTP_REQUIRED_BENDAHARA_UMUM: ${{ secrets.UAT_OTP_REQUIRED_BENDAHARA_UMUM }}
      UAT_TOTP_SECRET_BENDAHARA_UMUM: ${{ secrets.UAT_TOTP_SECRET_BENDAHARA_UMUM }}

      UAT_EMAIL_KETUA_BIDANG: ${{ secrets.UAT_EMAIL_KETUA_BIDANG }}
      UAT_PASSWORD_KETUA_BIDANG: ${{ secrets.UAT_PASSWORD_KETUA_BIDANG }}
      UAT_OTP_REQUIRED_KETUA_BIDANG: ${{ secrets.UAT_OTP_REQUIRED_KETUA_BIDANG }}
      UAT_TOTP_SECRET_KETUA_BIDANG: ${{ secrets.UAT_TOTP_SECRET_KETUA_BIDANG }}

      UAT_EMAIL_SEKRETARIS_BIDANG: ${{ secrets.UAT_EMAIL_SEKRETARIS_BIDANG }}
      UAT_PASSWORD_SEKRETARIS_BIDANG: ${{ secrets.UAT_PASSWORD_SEKRETARIS_BIDANG }}
      UAT_OTP_REQUIRED_SEKRETARIS_BIDANG: ${{ secrets.UAT_OTP_REQUIRED_SEKRETARIS_BIDANG }}
      UAT_TOTP_SECRET_SEKRETARIS_BIDANG: ${{ secrets.UAT_TOTP_SECRET_SEKRETARIS_BIDANG }}

      UAT_EMAIL_PJ_SEKSI: ${{ secrets.UAT_EMAIL_PJ_SEKSI }}
      UAT_PASSWORD_PJ_SEKSI: ${{ secrets.UAT_PASSWORD_PJ_SEKSI }}
      UAT_OTP_REQUIRED_PJ_SEKSI: ${{ secrets.UAT_OTP_REQUIRED_PJ_SEKSI }}
      UAT_TOTP_SECRET_PJ_SEKSI: ${{ secrets.UAT_TOTP_SECRET_PJ_SEKSI }}

      UAT_EMAIL_PJ_SEKSI_NONAKTIF: ${{ secrets.UAT_EMAIL_PJ_SEKSI_NONAKTIF }}
      UAT_PASSWORD_PJ_SEKSI_NONAKTIF: ${{ secrets.UAT_PASSWORD_PJ_SEKSI_NONAKTIF }}
      UAT_OTP_REQUIRED_PJ_SEKSI_NONAKTIF: ${{ secrets.UAT_OTP_REQUIRED_PJ_SEKSI_NONAKTIF }}
      UAT_TOTP_SECRET_PJ_SEKSI_NONAKTIF: ${{ secrets.UAT_TOTP_SECRET_PJ_SEKSI_NONAKTIF }}

      UAT_EMAIL_PANITIA_LAPANGAN: ${{ secrets.UAT_EMAIL_PANITIA_LAPANGAN }}
      UAT_PASSWORD_PANITIA_LAPANGAN: ${{ secrets.UAT_PASSWORD_PANITIA_LAPANGAN }}
      UAT_OTP_REQUIRED_PANITIA_LAPANGAN: ${{ secrets.UAT_OTP_REQUIRED_PANITIA_LAPANGAN }}
      UAT_TOTP_SECRET_PANITIA_LAPANGAN: ${{ secrets.UAT_TOTP_SECRET_PANITIA_LAPANGAN }}

      HEADLESS: 'true'
      RETRIES: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard batch concurrency and cooldown inputs
        # Fail fast BEFORE touching staging: the `workers`/`cooldown_seconds`
        # dispatch inputs must not undercut the login throttle. The app limits
        # login POSTs to 5/min per email+IP, so workers>1 bunches logins inside
        # the same 60s window and cooldown<policy reintroduces the 429 risk.
        # reporting.config.json is the single source of truth for the policy.
        run: |
          set -euo pipefail
          WORKERS="${{ inputs.workers }}"
          COOLDOWN="${{ inputs.cooldown_seconds }}"
          POLICY_WORKERS="$(jq -r '.loginPolicy.workersPerBatch' reporting.config.json)"
          POLICY_COOLDOWN="$(jq -r '.loginPolicy.cooldownSecondsAfterBatch' reporting.config.json)"

          if ! [[ "$COOLDOWN" =~ ^[0-9]+$ ]]; then
            echo "ERROR: cooldown_seconds must be a non-negative integer (got '$COOLDOWN')."
            exit 1
          fi
          if [ "$WORKERS" != "$POLICY_WORKERS" ]; then
            echo "ERROR: workers=$WORKERS but loginPolicy.workersPerBatch=$POLICY_WORKERS."
            echo "Parallel logins trip the 60s login throttle; keep workers=$POLICY_WORKERS."
            exit 1
          fi
          if [ "$COOLDOWN" -lt "$POLICY_COOLDOWN" ]; then
            echo "ERROR: cooldown_seconds=$COOLDOWN is below loginPolicy.cooldownSecondsAfterBatch=$POLICY_COOLDOWN."
            exit 1
          fi

          echo "Batch safety inputs OK (workers=$WORKERS, cooldown=${COOLDOWN}s >= ${POLICY_COOLDOWN}s)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Compute run id
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID="${{ github.run_id }}"; fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Resolved RUN_ID=$RUN_ID"

      - name: Type check
        run: npm run typecheck

      - name: Validate batch selection (no execution)
        run: npm run batches:validate

      - name: Run configured batches sequentially
        id: batches
        run: |
          set -uo pipefail
          # RUN_ID is exported to this step by the "Compute run id" step. Guard
          # it explicitly: `$RUN_ID__` would be parsed by bash as the variable
          # RUN_ID__ (an unrelated, unset name), which trips set -u before any
          # batch can run. Always brace-interpolate: ${RUN_ID}__${BATCH_ID}.
          : "${RUN_ID:?RUN_ID is empty: the 'Compute run id' step must run first}"
          mkdir -p reports/json reports/summary
          REQUESTED="${{ inputs.batch_ids }}"
          WORKERS="${{ inputs.workers }}"
          COOLDOWN="${{ inputs.cooldown_seconds }}"
          RC=0
          RAN=0

          mapfile -t BATCH_LINES < <(
            jq -r '.batches[] | [.id, .spec, (.scenarioIds | join("|"))] | @tsv' reporting.config.json
          )
          if [ "${#BATCH_LINES[@]}" -eq 0 ]; then
            echo "ERROR: no batches parsed from reporting.config.json"
            exit 1
          fi

          for line in "${BATCH_LINES[@]}"; do
            IFS=$'\t' read -r BATCH_ID SPEC GREP <<< "$line"
            if [ "$REQUESTED" != "all" ] && [[ ",$REQUESTED," != *",$BATCH_ID,"* ]]; then
              echo "Skipping batch $BATCH_ID (not requested)"
              continue
            fi

            # Cooldown runs BEFORE every batch (including the first). A trailing
            # cooldown would not protect a fresh run from the previous run's
            # last logins, whereas leading cooldowns guarantee >=COOLDOWNs of
            # spacing between any two batches across runs. Cost is identical
            # (one sleep per batch).
            echo "Cooldown ${COOLDOWN}s before batch $BATCH_ID (login throttle: 5/min)..."
            sleep "$COOLDOWN"

            echo "::group::Batch $BATCH_ID ($SPEC)"
            export BATCH_ID
            export BLOB_DIR="$PWD/blob-report/$RUN_ID/$BATCH_ID"
            export JSON_REPORT="$PWD/reports/json/${RUN_ID}__${BATCH_ID}.json"
            export PW_OUTPUT_DIR="$PWD/test-results/$RUN_ID/$BATCH_ID"
            export HTML_REPORT_DIR="$PWD/reports/html-raw/$RUN_ID/$BATCH_ID"

            npx playwright test "$SPEC" --grep "$GREP" --workers "$WORKERS" || RC=$?
            echo "::endgroup::"
            RAN=$((RAN + 1))
          done

          if [ "$RAN" -eq 0 ]; then
            echo "ERROR: no requested batches matched reporting.config.json (requested=$REQUESTED)"
            exit 1
          fi

          echo "Batch run finished with aggregate rc=$RC"
          # Do NOT fail here: reporting must still run. The final step sets the
          # job status from this rc.
          echo "BATCH_RC=$RC" >> "$GITHUB_ENV"

      - name: Merge batch reports into one HTML report
        if: ${{ !cancelled() }}
        run: node scripts/merge-reports.mjs --run-id "$RUN_ID"

      - name: Generate scenario execution summary
        if: ${{ !cancelled() }}
        run: node scripts/generate-summary.mjs --run-id "$RUN_ID"

      - name: Upload consolidated HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ env.RUN_ID }}
          path: reports/html/${{ env.RUN_ID }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload scenario summary (xlsx/csv/json)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scenario-summary-${{ env.RUN_ID }}
          path: reports/summary
          if-no-files-found: warn
          retention-days: 30

      - name: Upload raw evidence (traces/screenshots/videos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-evidence-${{ env.RUN_ID }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload per-batch blob reports and JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: batch-reports-${{ env.RUN_ID }}
          path: |
            blob-report
            reports/json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if any batch failed
        if: ${{ !cancelled() && env.BATCH_RC != '0' }}
        run: |
          echo "One or more batches failed (rc=$BATCH_RC). See artifacts for details."
          exit 1
